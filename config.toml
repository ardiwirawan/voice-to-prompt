# voice-to-prompt configuration
# Semua field opsional — hapus yang tidak perlu, default-nya masuk akal.
#
# Cara termudah mengubah setting: lewat UI — klik kanan ikon di area notifikasi → Pengaturan…
# UI menulis ke config.local.toml (otomatis di-gitignore) yang MENIMPA file ini,
# dan perubahan langsung berlaku tanpa restart.

# Bahasa antarmuka untuk jendela Pengaturan: "en" (English) | "id" (Indonesia)
ui_language = "en"

# Tombol pemicu global. Contoh: "f9", "f8", "ctrl+alt+v", "pause"
hotkey = "f9"

# true  = transkrip diketik otomatis di posisi kursor
# false = hanya masuk clipboard (paste manual)
auto_type = true

# Delay antar karakter saat mengetik (detik). Naikkan jika aplikasi target lambat.
typing_delay = 0.01

# Bunyi bip sebagai penanda status (mulai/selesai/gagal)
beeps = true

[recording]
sample_rate = 16000          # optimal untuk Whisper
channels = 1
silence_threshold = 0.012    # ambang RMS "ada suara"; naikkan di ruangan bising
silence_stop_after = 2.0     # berhenti setelah hening selama ini (detik)
initial_timeout = 6.0        # batal jika tak ada suara sama sekali (detik)
min_seconds = 0.8            # rekaman minimal
max_seconds = 60.0           # batas maksimal rekaman
stop_with_hotkey = true      # tekan tombol lagi saat merekam = berhenti manual

# Substring nama mic, di-resolve ulang setiap rekaman (tahan pergeseran index).
# Kosong = device default sistem. Contoh: "Microphone Array", "Headset", "USB"
device = "Microphone Array"

[transcription]
engine = "groq"              # saat ini: "groq"
model = "whisper-large-v3"   # atau "whisper-large-v3-turbo" (lebih cepat)
language = ""                # kosong = auto-detect; atau "id", "en", dst.

# API key dibaca dari env var ini dulu, lalu file ini (relatif ke config):
api_key_env = "GROQ_API_KEY"
api_key_file = "groq_key.txt"

[cleanup]
# Rapikan transkrip mentah pakai LLM: buang kata pengisi ("eee", "umm"),
# pakai koreksi terakhir pembicara, tambah tanda baca. Gagal = teks mentah dipakai.
enabled = true
model = "qwen/qwen3.8-27b"   # alternatif: openai/gpt-oss-20b (lebih cepat)
